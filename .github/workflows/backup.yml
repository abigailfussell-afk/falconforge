name: Nightly encrypted database backup

# WHY THIS EXISTS (SYNC-11 / OPS-09)
#
# `docs/beta-ops.md` has documented a `supabase db dump` one-liner and "weekly during the
# season" since Sprint 7. It was a human habit with nothing running it: `grep 'db dump'` over
# `.github/workflows` found only the doc. On the free tier there is no PITR and no daily
# backup, so the honest description of the recovery position was "lose everything since the
# last time somebody remembered" — and the likeliest casualty is a Sunday competition's
# scouting, reported on Monday.
#
# WHAT THIS IS NOT
#
# It is not a substitute for Supabase Pro's PITR. It is a nightly, encrypted, 30-day snapshot
# that makes the worst case "lose up to a day" instead of "lose up to a fortnight". The plan's
# trigger for Pro is D7's to move.
#
# THE DUMP CONTAINS EVERY MINOR'S NAME.
#
# That is the whole reason it is encrypted before it leaves the runner rather than after. A
# GitHub artifact is readable by anyone with repo access; the passphrase is not in the repo.
# `docs/beta-ops.md` carries the restore procedure and the secret names.

on:
  schedule:
    # 07:10 UTC — after midnight in US Pacific, so a full day's work is included and the run
    # does not collide with the evening a team is actually using the app.
    - cron: '10 7 * * *'
  # So the first run can be proved rather than waited for, and so a restore rehearsal can take
  # a fresh dump on demand.
  workflow_dispatch:

# One backup at a time. Two overlapping `pg_dump`s against the free tier is a way to find its
# connection limit at 07:10.
concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  dump:
    name: Dump, encrypt, retain 30 days
    runs-on: ubuntu-latest
    # A dump of a beta-sized database is seconds. This is the ceiling for "the database is
    # unreachable and the CLI is retrying", not an expected duration.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # FAIL LOUDLY WHEN THE SECRETS ARE MISSING, rather than skipping.
      #
      # A backup job that quietly does nothing is precisely the failure this ID is about: a
      # documented procedure nobody runs, discovered on the day it is needed. Until Kevin adds
      # the two secrets this workflow will go red every night — deliberately, and recorded in
      # `docs/beta-ops.md` so the noise is expected rather than mysterious.
      - name: Check the secrets exist
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=""
          [ -z "$DB_URL" ] && missing="$missing SUPABASE_DB_URL"
          [ -z "$PASSPHRASE" ] && missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "See docs/beta-ops.md, section 'Backups', for what each one is and how to set it."
            exit 1
          fi

          # ------------------------------------------------------------------------------------
          # PRESENT IS NOT THE SAME AS USABLE, and this job's first ever run proved it.
          #
          # Both secrets were set weeks ago and this check passed. The dump then failed thirty
          # seconds later, after pulling a 300 MB postgres image, with:
          #
          #   pg_dump: error: connection to server at "db.<ref>.supabase.co" (2600:1f14:...),
          #   port 5432 failed: Network is unreachable
          #   Your network does not support IPv6, which is required for direct connections.
          #
          # GitHub's hosted runners have no IPv6. Supabase's DIRECT database host resolves to
          # IPv6 only on the free tier, so `db.<ref>.supabase.co` can never be reached from here
          # — not intermittently, never. The secret has to be the POOLER connection string,
          # which is IPv4.
          #
          # Checked here rather than left to pg_dump because the difference between "the backup
          # is configured" and "the backup works" was thirty days of green-looking nothing: this
          # job would have failed at 07:10 every night, and the first anybody would have known is
          # the morning they needed a restore.
          #
          # SESSION pooler (5432), not transaction (6543): pg_dump uses prepared statements and
          # session-level settings that transaction pooling does not carry.
          # ------------------------------------------------------------------------------------
          case "$DB_URL" in
            *pooler.supabase.com*) : ;;
            *)
              echo "::error::SUPABASE_DB_URL is not a pooler connection string."
              echo "GitHub runners have no IPv6, and the direct host (db.<ref>.supabase.co) is"
              echo "IPv6-only, so pg_dump can never reach it from Actions."
              echo "Fix: Supabase Dashboard -> Connect -> Session pooler (port 5432), copy that"
              echo "URI, and set it as the SUPABASE_DB_URL repository secret."
              exit 1
              ;;
          esac

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the same version as ci.yml and the devDependency. A floating `latest`
          # resolves through the rate-limited GitHub API and has taken CI red on a docs-only
          # commit before now (docs/environment-divergences.md section 6).
          version: 2.114.0

      - name: Dump the database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # TWO dumps, because `supabase db dump` with no flag is SCHEMA ONLY.
          #
          # This was found by rehearsing the sequence against the local stack rather than by
          # reading it: the single-command version produced a 137 KB file with zero `COPY`
          # statements in it — every table, every policy, every function, and not one row. It
          # also sailed past the 50 KB check below, so the job would have gone green nightly
          # for thirty days and the artifact would have restored an empty database.
          #
          # `--data-only` alone is not enough either: the schema has to exist first, and
          # `db push` cannot replay this repo's squashed migration history (beta-ops.md). So:
          # schema, then data, concatenated in restore order into one file that `psql -f`
          # applies on its own. The data half opens with `SET session_replication_role =
          # replica`, which is what lets it load without fighting foreign keys.
          supabase db dump --db-url "$DB_URL" -f schema.sql
          supabase db dump --db-url "$DB_URL" --data-only -f data.sql

          # ------------------------------------------------------------------------------------
          # IS THIS A REAL BACKUP? Counted, not weighed.
          #
          # This was a 50 KB floor on `data.sql`, and the first run that ever reached it failed:
          # production's data half is **38 452 bytes**. Nothing was wrong with the dump — the same
          # database dumped by hand the same day produced 37 155 bytes of data, and that file was
          # verified by RESTORING it and applying all 14 pending migrations on top. The floor was
          # a guess made before anyone had measured the thing it was guarding.
          #
          # A byte count is the wrong instrument twice over: it fails a small database that is
          # perfectly backed up, and it passes a large one whose rows are missing but whose
          # `SET`/`COMMENT` preamble is bulky. So use the check `docs/beta-ops.md` already
          # documents and calls "the check worth doing on any backup, here or anywhere else in
          # this document" — count the INSERT statements, and name the tables that must be there.
          #
          # `INSERT INTO`, not `COPY`: the Supabase CLI emits multi-row inserts, and a check
          # written for `COPY` reports zero on a perfectly good backup — the false alarm that
          # teaches people to ignore the check.
          #
          # `auth.users` and `public.teams` specifically, because those two are the ones whose
          # loss cannot be undone by re-running anything: an account and a tenancy. A dump that
          # has them has the irreplaceable part; a dump missing them is not worth encrypting.
          # ------------------------------------------------------------------------------------
          data_bytes=$(wc -c < data.sql)
          echo "data_bytes=$data_bytes" >> "$GITHUB_ENV"

          inserts=$(grep -c '^INSERT INTO ' data.sql || true)
          echo "insert_statements=$inserts" >> "$GITHUB_ENV"
          echo "Data dump: ${data_bytes} bytes, ${inserts} INSERT statement(s)."
          grep -o '^INSERT INTO "[a-z_]*"\."[a-z_]*"' data.sql | sort -u || true

          if [ "$inserts" -eq 0 ]; then
            echo "::error::The data dump has no INSERT statements at all — it would restore an empty database."
            exit 1
          fi

          for required in '"auth"."users"' '"public"."teams"'; do
            grep -q "^INSERT INTO ${required}" data.sql || {
              echo "::error::The data dump has no rows for ${required}. That is the part a restore cannot rebuild."
              exit 1
            }
          done

          # A floor low enough to catch only a truly broken file, since the real check is above.
          if [ "$data_bytes" -lt 2048 ]; then
            echo "::error::The data dump is ${data_bytes} bytes. Something is badly wrong."
            exit 1
          fi

          # And the schema half has to actually be a schema.
          grep -q 'CREATE TABLE' schema.sql || {
            echo "::error::The schema dump contains no CREATE TABLE."
            exit 1
          }

          cat schema.sql data.sql > backup.sql
          rm -f schema.sql data.sql

      - name: Encrypt before it leaves the runner
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Symmetric AES-256, passphrase from the secret — no key material in the repo and
          # nothing to rotate but the secret itself. `--batch` so it never waits for a tty.
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$PASSPHRASE" \
              --output "backup-$(date -u +%Y-%m-%d).sql.gpg" backup.sql
          # The plaintext must not reach the artifact upload.
          shred -u backup.sql 2>/dev/null || rm -f backup.sql
          test ! -f backup.sql

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.sql.gpg
          # 30 days: long enough that a problem noticed a fortnight later is still recoverable,
          # short enough that a file containing every minor's name is not kept indefinitely.
          retention-days: 30
          if-no-files-found: error

      - name: Say what was kept
        run: |
          echo "### Nightly backup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- artifact: \`db-backup-${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- retained: 30 days" >> "$GITHUB_STEP_SUMMARY"
          echo "- encrypted: gpg symmetric, AES-256" >> "$GITHUB_STEP_SUMMARY"
          # The numbers, not just the claim. A summary saying "backup taken" is what thirty days
          # of green would have looked like while the artifact restored an empty database.
          echo "- data: ${data_bytes} bytes, ${insert_statements} INSERT statement(s)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Restore procedure: \`docs/beta-ops.md\`, section **Backups**." >> "$GITHUB_STEP_SUMMARY"
