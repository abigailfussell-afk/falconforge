name: Deploy

# Replaces the manual "Add files via upload" deploys. Building in CI means the deployed
# bundle always corresponds to a known commit, and old bundles stop accumulating: the
# gh-pages branch is replaced wholesale each time rather than added to.
#
# AUTOMATIC AGAIN AS OF SPRINT 7, on Kevin's call at kickoff.
#
# Sprint 6 made this `workflow_dispatch` only. The argument for that was never "a bad deploy locks
# users out" — production has been GREENFIELD since Sprint 3's `db reset --linked` emptied
# `auth.users`, and it holds Kevin's account, his `platform_operators` row, TestTeam and one gift
# grant. There is nobody to lock out but him, and he holds the service key. The reason that
# survived was the MIGRATION: a forward migration on a frozen schema, landing on the one database
# holding an operator identity no API path can recreate. Sprint 4's incident was a bundle deployed
# against a database that did not match.
#
# WHAT CHANGED, AND WHAT DID NOT. That migration hazard is real and is not solved by this workflow;
# it is solved by applying migrations to the hosted project deliberately, BEFORE merging the branch
# that depends on them. Making every deploy manual to protect against the occasional schema change
# taxed the common case to guard the rare one. Sprint 7 also puts a smoke pack in front of a merge
# for the first time (CI now runs on `v2/**`), and adds the post-deploy check below, so the
# feedback loop a manual click was standing in for now exists in automation.
#
# SO THE RULE IS: schema changes are ordered by hand, everything else ships on merge.
#
# When a branch carries a migration, apply it to the hosted project first and verify, then merge.
# The honest trigger for returning to manual deploys is BETA ONBOARDING — once real teams are on
# it, the caution Sprint 6 exercised early stops being premature and starts being correct.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race. Do NOT cancel a deploy in progress -- a half-finished
# deploy would leave the site in a mixed state.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push the built output to the gh-pages branch
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ONE GATE, NOT A HAND-COPIED LIST OF ITS PARTS (OPS-10).
      #
      # These four steps used to be spelled out here: `npx tsc --noEmit`, `test:run`,
      # `test:integration`, `build`. That is the Gate written out a fourth time, and this repo
      # has already paid for that: three definitions of "done" had drifted apart, and the one
      # an agent read was not the one CI ran. `npm run lint` in particular was `tsc --noEmit`
      # for eight sprints while every rule document called it linting — and this file called
      # `tsc` directly, so adding ESLint to the lint script did not add it to the deploy.
      #
      # `npm run gate` IS lint (tsc + eslint) -> unit -> integration -> build. Calling it means
      # a change to the definition of done reaches the deploy automatically, and
      # `harness-invariants.test.ts` asserts the script's contents so the definition cannot
      # quietly change either.
      #
      # The build's env is set on this step because the Gate ends in `npm run build`.
      - name: Gate (lint, unit, integration, build)
        run: npm run gate
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # public/CNAME is copied into dist by Vite, which keeps the custom domain bound.
      # If this file ever goes missing, GitHub Pages drops falcon-forge.com back to the
      # default *.github.io address.
      - name: Verify CNAME survived the build
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing - custom domain would break"; exit 1; }
          echo "CNAME: $(cat dist/CNAME)"

      # Publishing sourcemaps makes the full application source downloadable from the live
      # site. Vite and Workbox emit them from separate settings, so this checks the actual
      # output rather than trusting both config flags to stay correct.
      - name: Refuse to publish sourcemaps
        run: |
          maps=$(find dist -name '*.map' -print)
          if [ -n "$maps" ]; then
            echo "::error::Sourcemaps present in dist/ - these would be publicly downloadable:"
            echo "$maps"
            exit 1
          fi
          echo "No .map files in dist/"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # force_orphan keeps a single-commit gh-pages branch, so stale bundles from
          # previous builds are removed instead of piling up the way the manual uploads did.
          force_orphan: true

      # GitHub Pages serves from a CDN that takes a moment to pick up a new publish, so
      # checking instantly would report the PREVIOUS bundle and pass for the wrong reason.
      - name: Wait for Pages to serve the new bundle
        run: sleep 45

      # READ-ONLY, by Kevin's decision at Sprint 7 kickoff. Every request is a GET or a HEAD and
      # nothing is written to the hosted database -- a write-path check would need a dedicated
      # account and would leave rows behind in the database beta teams will share.
      #
      # This is the half the smoke pack structurally cannot cover: the smoke pack runs against
      # the local stack, so it can never see a 404ing bundle, an unbound custom domain, a rotated
      # anon key, or RLS refusing anonymous callers on the real database.
      - name: Read-only production check
        run: node scripts/check-production.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
