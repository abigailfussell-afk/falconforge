name: Deploy

# Replaces the manual "Add files via upload" deploys. Building in CI means the deployed
# bundle always corresponds to a known commit, and old bundles stop accumulating: the
# gh-pages branch is replaced wholesale each time rather than added to.
#
# MANUAL SINCE SPRINT 6, DELIBERATELY. The `push` trigger is gone.
#
# NOT because a bad deploy would lock users out. Production is still GREENFIELD: it was
# `db reset --linked` at Sprint 3 with `auth.users` emptied, and it holds Kevin's account, his
# `platform_operators` row, TestTeam and one gift grant. There is nobody else to lock out, and he
# holds the service key. An earlier version of this comment claimed a mis-read `team_entitlement`
# "shows a lock screen to real users" — there are none until beta teams onboard, and inflating the
# stakes is how a precaution stops being taken seriously.
#
# THE REASON THAT SURVIVES IS THE MIGRATION, NOT THE BUNDLE. Sprint 6 carries the second forward
# migration on the frozen schema, against the one database holding the operator identity that
# `grant_team_license` checks and that no API path can recreate. Sprint 4's incident was a bundle
# deployed against a database missing its columns; ordering those two by hand is worth one click.
#
# CI still runs on every push to main, so nothing about verification is weakened — only the moment
# the live site changes moves under human control. Deploy from the Actions tab ("Run workflow").
#
# Revisit at the end of Sprint 7, or at beta onboarding, whichever comes first. With no users,
# reverting to auto-deploy is defensible today; once real teams are on it, the argument this comment
# originally made stops being premature and starts being correct.
on:
  workflow_dispatch:

# Never let two deploys race. Do NOT cancel a deploy in progress -- a half-finished
# deploy would leave the site in a mixed state.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push the built output to the gh-pages branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Deploying a build that does not typecheck or pass tests is how a broken site
      # happens. The same gates as ci.yml, before anything is published.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:run

      # The integration suite holds every sync data-loss regression (B1-B18). Without this
      # step those tests could be red while production deployed green -- exactly the class of
      # bug the sync engine was hardened against (C8).
      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # public/CNAME is copied into dist by Vite, which keeps the custom domain bound.
      # If this file ever goes missing, GitHub Pages drops falcon-forge.com back to the
      # default *.github.io address.
      - name: Verify CNAME survived the build
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing - custom domain would break"; exit 1; }
          echo "CNAME: $(cat dist/CNAME)"

      # Publishing sourcemaps makes the full application source downloadable from the live
      # site. Vite and Workbox emit them from separate settings, so this checks the actual
      # output rather than trusting both config flags to stay correct.
      - name: Refuse to publish sourcemaps
        run: |
          maps=$(find dist -name '*.map' -print)
          if [ -n "$maps" ]; then
            echo "::error::Sourcemaps present in dist/ - these would be publicly downloadable:"
            echo "$maps"
            exit 1
          fi
          echo "No .map files in dist/"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # force_orphan keeps a single-commit gh-pages branch, so stale bundles from
          # previous builds are removed instead of piling up the way the manual uploads did.
          force_orphan: true
