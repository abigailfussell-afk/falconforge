name: CI

on:
  pull_request:
  push:
    # Deploys are handled by deploy.yml on main; this is the gate for everything else.
    #
    # 'v2/**' was missing until Sprint 7, and the omission silently inverted the point of
    # having CI: every sprint branch since Sprint 1 was pushed with ZERO workflows fired
    # (confirmed against the Actions API after pushing v2/sprint-6-licensing), so the first
    # CI signal a sprint ever got arrived AFTER its merge to main -- the one moment it is
    # useless. Nothing was caught by this only because the Gate is genuinely run locally and
    # reported. Any new sprint-branch namespace belongs on this list on the day it is coined.
    branches: [main, 'refactor/**', 'v2/**']

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Ordered cheapest-first so an obvious break fails in seconds, not minutes.
      #
      # This calls the npm scripts rather than the tools directly. It used to run
      # `npx tsc --noEmit`, which meant CI and `npm run lint` were two definitions of the
      # same step and renaming one would not have touched the other.
      - name: Lint and typecheck
        run: npm run lint

      - name: Unit tests
        # UTC is the runner's default; naming it makes a red run reproducible locally.
        env:
          TZ: UTC
        run: npm run test:run

      # The same suite again, at a negative UTC offset. Not belt-and-braces: this project has
      # had timezone defects in BOTH directions, and either single zone hides one of them.
      #
      #   - Sprint 8's create-event default ends `start + 2h`, which crosses midnight. Green
      #     in US Central at 18:32, red on a UTC runner at 23:32 — caught only because CI
      #     happened to run inside that five-hour window.
      #   - Sprint 5.5's due dates render one day EARLY at negative offsets, because a
      #     date-only value is stored as UTC-midnight epoch millis and read with local
      #     getDate(). A UTC-only run can never see it.
      #
      # Fourteen seconds for a class that has cost two incidents and reaches every user
      # in the app's own timezone.
      - name: Unit tests (negative UTC offset)
        env:
          TZ: America/Chicago
        run: npm run test:run

      - name: Integration tests
        env:
          TZ: UTC
        run: npm run test:integration

      - name: Build
        run: npm run build

  schema:
    name: Schema rebuilds from migrations, and enforces isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # PINNED, and it must match the `supabase` devDependency.
          #
          # Sprint 2's parking lot says "the Supabase CLI is pinned to the version CI
          # installs (2.114)" and gives the reason: developing against an older local stack
          # than CI runs is what hid the missing API-role grants until they reached `main`.
          # That note was aspirational -- both jobs said `latest`, so the local stack was
          # pinned and CI floated, which is the same gap facing the other way.
          #
          # `latest` also resolves through the GitHub API, which is rate-limited on shared
          # runners: it took CI red on a DOCS-ONLY commit, before a single test ran.
          version: 2.114.0

      # The point of this job: prove supabase/migrations/ alone can reconstruct the
      # database. Until 2026-08-09 it could not -- migrations began at 009 and the
      # 001-008 that created the tables were never committed. If this job goes red,
      # the repo has stopped being the source of truth for the schema again.
      - name: Start local stack (applies all migrations)
        run: supabase start

      - name: Rebuild from scratch
        run: supabase db reset

      # Assertions live in supabase/tests/schema_assertions.sql so they can be run locally
      # with the same command. `supabase db execute` does not exist -- psql is preinstalled
      # on ubuntu-latest runners and the local stack exposes Postgres on 54322.
      - name: Assert schema invariants
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/schema_assertions.sql

      # Everything above proves the schema can be BUILT. This proves it BEHAVES: the
      # tenant-isolation suite (C7) plus the sync drain and pull running against real
      # PostgREST. `schema_assertions.sql` can only tell you a policy exists, not what it
      # permits -- and this repo has shipped a policy that permitted everything.
      #
      # In the same job as `supabase start` because these need that stack. There is no
      # skip-if-absent path: if the database is missing, `npm run test:db` fails.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Behavioural database tests (RLS + data layer)
        run: npm run test:db

      # Coverage runs HERE and nowhere else (OPS-01). It measures all three suites merged,
      # and the db suite needs the stack this job has already started -- running it in the
      # `test` job would report the unit suite's coverage as if it were the whole picture,
      # which is the flattering half of the number.
      #
      # It was enforced by nothing for nine sprints, so the thresholds set in Sprint 5 drifted
      # about six points above the truth while new files landed underneath them. They have been
      # re-measured downward to today's floor and may only go up; see the comment in
      # `vitest.config.coverage.ts` for why lowering was the honest move rather than deleting.
      - name: Coverage thresholds (all three suites, merged)
        run: npm run test:coverage

  smoke:
    name: Smoke pack drives the built app in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # PINNED, and it must match the `supabase` devDependency.
          #
          # Sprint 2's parking lot says "the Supabase CLI is pinned to the version CI
          # installs (2.114)" and gives the reason: developing against an older local stack
          # than CI runs is what hid the missing API-role grants until they reached `main`.
          # That note was aspirational -- both jobs said `latest`, so the local stack was
          # pinned and CI floated, which is the same gap facing the other way.
          #
          # `latest` also resolves through the GitHub API, which is rate-limited on shared
          # runners: it took CI red on a DOCS-ONLY commit, before a single test ran.
          version: 2.114.0

      # The smoke pack talks to real PostgREST and real RLS through a real browser, so it
      # needs the same stack the database job builds.
      - name: Start local stack (applies all migrations)
        run: supabase start

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the app and serves it with `vite preview` rather than
      # running the dev server. That is not a detail: the dev server has no service worker, so
      # an offline navigation cannot fetch a lazy chunk and renders blank -- which would have
      # this job asserting things about the harness rather than the product, in the one
      # codebase where offline behaviour is the product.
      - name: Smoke pack
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
